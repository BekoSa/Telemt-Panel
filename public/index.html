<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telemt Control Panel</title>
<link rel="stylesheet" href="/assets/app.css">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090d;--bg1:#0c1018;--bg2:#111720;--bg3:#162030;
  --border:#1e2d3e;--border2:#253545;
  --text:#b8cfe4;--text2:#7a96b0;--text3:#3d5570;
  --accent:#00e5b4;--accent2:rgba(0,229,180,.12);--accent3:rgba(0,229,180,.06);
  --warn:#f5a832;--warn2:rgba(245,168,50,.12);
  --err:#ff4a5e;--err2:rgba(255,74,94,.12);
  --info:#4dd6ea;
  --mono:'IBM Plex Mono',monospace;--sans:'DM Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── Login ───────────────────────────────── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,229,180,.06) 0%,transparent 70%);pointer-events:none}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:.3;pointer-events:none}
.login-box{background:var(--bg1);border:1px solid var(--border2);padding:40px 44px;width:100%;max-width:400px;position:relative;z-index:1}
.login-box::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.login-logo{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--accent);margin-bottom:4px;letter-spacing:-1px}
.login-logo span{color:var(--text3)}
.login-sub{font-size:12px;color:var(--text3);font-family:var(--mono);margin-bottom:32px}
.login-label{display:block;font-size:11px;font-weight:600;color:var(--text3);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.login-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:14px;padding:10px 12px;outline:none;transition:border .15s;margin-bottom:14px}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;background:var(--accent2);border:1px solid rgba(0,229,180,.4);color:var(--accent);font-family:var(--sans);font-size:14px;font-weight:600;padding:11px;cursor:pointer;transition:all .2s;letter-spacing:.02em;margin-top:8px}
.login-btn:hover:not(:disabled){background:rgba(0,229,180,.2)}
.login-btn:disabled{opacity:.5;cursor:default}
.login-err{background:var(--err2);border:1px solid rgba(255,74,94,.25);padding:9px 12px;color:var(--err);font-family:var(--mono);font-size:12px;margin-bottom:16px}
.login-caps{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.login-cap{text-align:center}
.login-cap-label{font-size:10px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.login-cap-val{font-size:11px;color:var(--text2);font-family:var(--mono)}

/* ── Layout ──────────────────────────────── */
.layout{display:grid;grid-template-rows:52px 1fr;grid-template-columns:216px 1fr;height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:0;padding:0;background:var(--bg1);border-bottom:1px solid var(--border);z-index:10}
.sidebar{background:var(--bg1);border-right:1px solid var(--border);padding:12px 0;overflow-y:auto;display:flex;flex-direction:column}
.main{overflow-y:auto;padding:24px}

/* ── Topbar ──────────────────────────────── */
.topbar-brand{display:flex;align-items:center;gap:0;padding:0 20px;width:216px;border-right:1px solid var(--border);height:100%}
.brand{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--accent);letter-spacing:-.5px}
.brand span{color:var(--text2)}
.topbar-right{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 20px}
.topbar-status{display:flex;align-items:center;gap:8px;font-size:12px;font-family:var(--mono);color:var(--text3)}
.topbar-status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1;box-shadow:0 0 8px var(--accent)}50%{opacity:.6;box-shadow:0 0 4px var(--accent)}}
.topbar-user{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--border);font-family:var(--mono);font-size:12px;color:var(--text2)}
.topbar-user svg{color:var(--text3)}
.readonly-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;background:var(--warn2);color:var(--warn);border:1px solid rgba(245,168,50,.3)}
.logout-btn{background:none;border:1px solid var(--border);color:var(--text3);font-family:var(--mono);font-size:11px;padding:4px 10px;cursor:pointer;transition:all .15s}
.logout-btn:hover{border-color:var(--err);color:var(--err)}

/* ── Sidebar ─────────────────────────────── */
.nav-section{padding:6px 12px 2px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-family:var(--mono)}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 16px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .15s;border-left:2px solid transparent}
.nav-item:hover{color:var(--text);background:var(--bg2)}
.nav-item.active{color:var(--accent);background:var(--accent3);border-left-color:var(--accent)}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.8}
.nav-item.active svg{opacity:1}

/* ── Buttons ─────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;border:1px solid;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent2);border-color:rgba(0,229,180,.4);color:var(--accent)}
.btn-primary:hover{background:rgba(0,229,180,.2)}
.btn-danger{background:var(--err2);border-color:rgba(255,74,94,.3);color:var(--err)}
.btn-danger:hover{background:rgba(255,74,94,.2)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--border2);color:var(--text);background:var(--bg2)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}

/* ── Cards & Grids ───────────────────────── */
.card{background:var(--bg1);border:1px solid var(--border);padding:16px 20px;margin-bottom:16px}
.card-title{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--bg2);border:1px solid var(--border);padding:14px 16px}
.stat-label{font-size:11px;color:var(--text3);font-family:var(--mono);letter-spacing:.04em;margin-bottom:4px}
.stat-value{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--text);line-height:1}
.stat-value.accent{color:var(--accent)}.stat-value.warn{color:var(--warn)}.stat-value.err{color:var(--err)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px;font-family:var(--mono)}

/* ── Page header ─────────────────────────── */
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px}
.page-title svg{color:var(--accent)}
.page-actions{display:flex;gap:8px}

/* ── Tables ──────────────────────────────── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--bg2)}
th{padding:8px 14px;text-align:left;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg2)}
.mono{font-family:var(--mono);font-size:12px}

/* ── Badges ──────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-family:var(--mono);font-size:11px;font-weight:500}
.badge-ok{background:rgba(0,229,180,.1);color:var(--accent);border:1px solid rgba(0,229,180,.25)}
.badge-err{background:var(--err2);color:var(--err);border:1px solid rgba(255,74,94,.25)}
.badge-warn{background:var(--warn2);color:var(--warn);border:1px solid rgba(245,168,50,.25)}
.badge-info{background:rgba(77,214,234,.1);color:var(--info);border:1px solid rgba(77,214,234,.2)}
.badge-dim{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}

/* ── Data rows ───────────────────────────── */
.data-grid{display:grid;gap:0;border:1px solid var(--border)}
.data-row{display:grid;grid-template-columns:minmax(120px,220px) 1fr;border-bottom:1px solid var(--border)}
.data-row:last-child{border-bottom:none}
.data-key{padding:7px 14px;font-family:var(--mono);font-size:11px;color:var(--text3);background:var(--bg2);border-right:1px solid var(--border);display:flex;align-items:center;overflow:hidden;white-space:nowrap;min-width:0}
.data-val{padding:7px 14px;font-family:var(--mono);font-size:12px;color:var(--text);word-break:break-all;display:flex;align-items:center;flex-wrap:wrap;gap:4px}

/* ── Modal ───────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg1);border:1px solid var(--border2);padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:20px;color:var(--text)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* ── Forms ───────────────────────────────── */
.form-row{margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;display:block;font-family:var(--mono)}
.form-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 10px;outline:none;transition:border .15s}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--text3)}

/* ── Misc ────────────────────────────────── */
.progress-bar{height:4px;background:var(--bg3);overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--accent);transition:width .3s}
.progress-fill.warn{background:var(--warn)}.progress-fill.err{background:var(--err)}
.refresh-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.last-upd{font-family:var(--mono);font-size:11px;color:var(--text3)}
.error-box{background:var(--err2);border:1px solid rgba(255,74,94,.25);padding:12px 16px;color:var(--err);font-family:var(--mono);font-size:12px;margin-bottom:12px}
.empty-box{padding:40px;text-align:center;color:var(--text3);font-family:var(--mono);font-size:12px;border:1px dashed var(--border)}
.loading-box{padding:40px;text-align:center;color:var(--text3);font-family:var(--mono);font-size:12px}
.loading-box::after{content:'…';display:inline-block;animation:dots 1.2s infinite}
@keyframes dots{0%{content:'…'}33%{content:'.'}66%{content:'..'}100%{content:'…'}}
.cov-bar{display:flex;align-items:center;gap:8px}
.cov-track{flex:1;height:6px;background:var(--bg3);max-width:120px}
.tag-list{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--mono);font-size:10px;padding:2px 6px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.copy-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:0 4px;font-size:11px;font-family:var(--mono);transition:color .15s}
.copy-btn:hover{color:var(--accent)}
.link-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;font-family:var(--mono);font-size:10px;background:var(--bg3);border:1px solid var(--border);color:var(--info);cursor:pointer;transition:all .15s;text-decoration:none}
.link-chip:hover{background:var(--bg2);border-color:var(--info)}
.comp-row{display:grid;grid-template-columns:160px 80px 80px 80px 1fr;gap:0;padding:6px 14px;border-bottom:1px solid var(--border);font-size:12px;align-items:center}
.comp-row:last-child{border-bottom:none}
.comp-row-hdr{background:var(--bg2);font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3)}

/* ── Session toast ───────────────────────── */
.session-toast{position:fixed;bottom:24px;right:24px;background:var(--err);color:#fff;font-family:var(--mono);font-size:13px;padding:12px 20px;z-index:200;animation:slideup .3s ease}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/assets/app.js" defer></script>
</body>
</html>
