name: Apply WEB and WSS traffic telemetry

on:
  push:
    branches:
      - fix/globe-fonts-wss-traffic

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message != 'feat: expose WEB and WSS traffic telemetry' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add WEB and WSS traffic telemetry
        run: node scripts/add-web-traffic.js

      - name: Build frontend
        run: npm run build

      - name: Verify tests
        run: npm test

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.jsx
          git commit -m 'feat: expose WEB and WSS traffic telemetry'
          git push origin HEAD:fix/globe-fonts-wss-traffic
