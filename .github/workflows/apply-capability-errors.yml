name: Apply capability error migration

on:
  push:
    branches:
      - modernize/telemt-3.5.7

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message != 'fix: preserve real errors for optional Telemt capabilities' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply capability error handling
        run: node scripts/update-capability-errors.js

      - name: Build frontend
        run: npm run build

      - name: Verify tests
        run: npm test

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client.jsx
          git commit -m 'fix: preserve real errors for optional Telemt capabilities'
          git push origin HEAD:modernize/telemt-3.5.7
