name: Apply WEB runtime UI

on:
  push:
    branches:
      - modernize/telemt-3.5.7

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message != 'feat: add WEB runtime controls' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply WEB runtime UI migration
        run: node scripts/update-web-runtime.js

      - name: Verify tests
        run: npm test

      - name: Commit UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'feat: add WEB runtime controls'
          git push origin HEAD:modernize/telemt-3.5.7
