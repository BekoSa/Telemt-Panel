name: Apply link configurator integration

on:
  push:
    branches: [fix/globe-fonts-wss-traffic]
    paths:
      - .github/workflows/link-configurator-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/globe-fonts-wss-traffic
          fetch-depth: 0
      - name: Apply client patch
        run: node scripts/apply-link-configurator.cjs
      - name: Verify
        run: |
          npm ci
          npm run build
          npm test
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: integrate manual link configurator"
          git push origin HEAD:fix/globe-fonts-wss-traffic
