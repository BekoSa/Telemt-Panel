name: Apply Telemt UI integration

on:
  push:
    branches: [fix/globe-fonts-wss-traffic]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/globe-fonts-wss-traffic
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: python scripts/apply-telemt-coverage.py
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit integration
        run: |
          git config user.name "BekoSa"
          git config user.email "45966160+BekoSa@users.noreply.github.com"
          rm scripts/apply-telemt-coverage.py .github/workflows/apply-telemt-ui.yml
          git add src/client.jsx scripts/apply-telemt-coverage.py .github/workflows/apply-telemt-ui.yml
          git commit -m "feat: expose remaining Telemt 3.5.7 controls"
          git push origin HEAD:fix/globe-fonts-wss-traffic
