name: Apply local typography restore

on:
  push:
    branches:
      - fix/globe-fonts-wss-traffic

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message != 'build: self-host original panel fonts' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm install --save-dev @fontsource/ibm-plex-mono@5.3.0 @fontsource/dm-sans@5.3.0

      - name: Restore original typography locally
        run: node scripts/restore-fonts.js

      - name: Build frontend
        run: npm run build

      - name: Verify tests
        run: npm test

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/client.jsx public/index.html
          git commit -m 'build: self-host original panel fonts'
          git push origin HEAD:fix/globe-fonts-wss-traffic
