name: Apply runtime observability

on:
  push:
    branches:
      - modernize/telemt-3.5.7

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message != 'feat: add runtime edge observability' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply UI migration
        run: node scripts/update-runtime-edge-observability.js

      - name: Verify tests
        run: npm test

      - name: Commit UI migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'feat: add runtime edge observability'
          git push origin HEAD:modernize/telemt-3.5.7
